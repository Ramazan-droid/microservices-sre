apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: microshop/chat-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: microshop-config
                  key: BUSINESS_DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: microshop
spec:
  selector:
    app: chat-service
  ports:
    - port: 8005
      targetPort: 8005