apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: microshop/review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: microshop-config
                  key: BUSINESS_DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: microshop
spec:
  selector:
    app: review-service
  ports:
    - port: 8006
      targetPort: 8006