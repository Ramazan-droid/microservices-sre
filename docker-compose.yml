version: '3.8'

services:

  # Database 1: Identity (auth + user)
  postgres-identity:
    image: postgres:15-alpine
    container_name: postgres-identity
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d identity_db"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # Database 2: Business (product + order + chat + review)
  postgres-business:
    image: postgres:15-alpine
    container_name: postgres-business
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_business_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d business_db"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # Auth Service -> identity DB
  auth-service:
    build: ./services/auth
    container_name: auth-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-identity:5432/identity_db
      SECRET_KEY: supersecretjwtkey12345
    ports:
      - "8001:8001"
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # User Service -> identity DB
  user-service:
    build: ./services/user
    container_name: user-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-identity:5432/identity_db
    ports:
      - "8004:8004"
    depends_on:
      postgres-identity:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Product Service -> business DB
  product-service:
    build: ./services/product
    container_name: product-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-business:5432/business_db
    ports:
      - "8002:8002"
    depends_on:
      postgres-business:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Order Service -> business DB
  order-service:
    build: ./services/order
    container_name: order-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-business:5432/business_db
      PRODUCT_SERVICE_URL: http://product-service:8002
    ports:
      - "8003:8003"
    depends_on:
      postgres-business:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Chat Service -> business DB
  chat-service:
    build: ./services/chat
    container_name: chat-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-business:5432/business_db
    ports:
      - "8005:8005"
    depends_on:
      postgres-business:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Review Service -> business DB
  review-service:
    build: ./services/review
    container_name: review-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres-business:5432/business_db
    ports:
      - "8006:8006"
    depends_on:
      postgres-business:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Nginx
  nginx:
    build: ./frontend
    container_name: nginx-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - product-service
      - order-service
      - user-service
      - chat-service
      - review-service
    networks:
      - microservices-net
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - microservices-net
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - microservices-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - microservices-net
    restart: unless-stopped

volumes:
  postgres_identity_data:
  postgres_business_data:
  prometheus_data:
  grafana_data:

networks:
  microservices-net:
    driver: bridge