name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: SSH -> server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "SSH connection successful"
            hostname
            whoami

      - name: Update project on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git fetch origin
            git reset --hard origin/main

      - name: Build images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            docker build -t microshop/auth-service:latest ./services/auth
            docker build -t microshop/user-service:latest ./services/user
            docker build -t microshop/product-service:latest ./services/product
            docker build -t microshop/order-service:latest ./services/order
            docker build -t microshop/chat-service:latest ./services/chat
            docker build -t microshop/review-service:latest ./services/review
            docker build -t microshop/frontend:latest ./frontend

      - name: Deploy kube
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            docker save microshop/auth-service:latest | sudo k3s ctr images import -
            docker save microshop/user-service:latest | sudo k3s ctr images import -
            docker save microshop/product-service:latest | sudo k3s ctr images import -
            docker save microshop/order-service:latest | sudo k3s ctr images import -
            docker save microshop/chat-service:latest | sudo k3s ctr images import -
            docker save microshop/review-service:latest | sudo k3s ctr images import -
            docker save microshop/frontend:latest | sudo k3s ctr images import -

            sudo k3s kubectl apply -f k8s/

      - name: Testing
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            sudo k3s kubectl get nodes
            sudo k3s kubectl get pods -A
            sudo k3s kubectl get svc -A

            curl -I http://localhost || true

            echo "CI/CD finished successfully"